name: Build Index & Bundle

on:
  push:
    branches: [main]
    paths:
      - '_templates/**'
      - 'sources/**'
      - 'scripts/validate-and-build.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Valider et régénérer index.json, bundle.json et README.md
        run: node scripts/validate-and-build.mjs

      - name: Commiter les fichiers générés si modifiés
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add index.json bundle.json README.md
            git commit -m "chore: régénère index.json et bundle.json"
            git push
          else
            echo "index.json et bundle.json sont déjà à jour."
          fi
